description: 条件付き配列と、各要素内および配列後方の残余項目を読み書きする
input:
  - id: data
    format: rdw
    path: data/conditional.rdw
    encoding: utf-8
    fields: {import: conditional_fields.yml}
output:
  - id: records
    format: rdw
    path: out/conditional.rdw
    mode: overwrite
    encoding: utf-8
    fields: {import: conditional_fields.yml}
    sql: SELECT * FROM data
  - id: summary
    format: csv
    path: out/conditional.csv
    mode: overwrite
    encoding: utf-8
    sql: {import: conditional_summary.sql.yml}
