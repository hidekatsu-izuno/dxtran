description: 条件付き配列と残余項目を含むRDWの読み戻し
input:
  - id: data
    format: rdw
    path: out/conditional.rdw
    encoding: utf-8
    fields: {import: conditional_fields.yml}
output:
  - id: summary
    format: csv
    path: out/conditional_readback.csv
    mode: overwrite
    encoding: utf-8
    sql: {import: conditional_summary.sql.yml}
