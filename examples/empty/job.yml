input:
  - id: records
    format: csv
    path: data/header_only.csv
    encoding: utf-8
    fields: [{name: id}]
  - id: fixed_records
    format: fixed
    path: data/empty.dat
    encoding: utf-8
    fixed: {record_separator: none, record_length: 4}
    fields: [{name: id, length: 4}]
output:
  - id: csv
    sql: SELECT id FROM records
    format: csv
    path: out/header_only.csv
    mode: overwrite
    encoding: utf-8
  - id: fixed
    sql: SELECT id FROM records
    format: fixed
    path: out/empty.dat
    mode: overwrite
    encoding: utf-8
    fixed: {record_separator: none, record_length: 4}
    fields: [{name: id, length: 4}]
  - id: no_header
    sql: SELECT id FROM fixed_records
    format: csv
    path: out/no_header.csv
    mode: overwrite
    encoding: utf-8
    csv: {header: false}
