import: job.yml
input:
  - id: records
    format: csv
    path: data/records.csv
    encoding: utf-8
    fields: {import: fields.yml}
    check: {when: 'amount < 0', level: error, message: '入力金額が負のため終了コード12で終了します。'}
output:
  - id: copied
    sql: SELECT * FROM records
    format: csv
    path: out/input_error.csv
    mode: overwrite
    encoding: utf-8
