[package]
name = "dxtran"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Deterministic SQL batch conversion for CSV, fixed and RDW files"

[[bin]]
name = "dxt"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "unicode_expressions", "datetime_expressions", "regex_expressions", "string_expressions"] }
encoding_rs = "=0.8.35"
futures = "0.3"
hex = "0.4"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "signal", "macros"] }
yaml-rust2 = "0.10"

[profile.dev]
debug = 0

[profile.test]
debug = 0
