[package]
name = "dxtran"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Deterministic SQL batch conversion for CSV, fixed, RDW and Parquet files"

[[bin]]
name = "dxt"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
datafusion = { version = "=55.2.0", default-features = false, features = ["sql", "unicode_expressions", "datetime_expressions", "regex_expressions", "string_expressions", "nested_expressions"] }
encoding_rs = "=0.8.35"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures = "0.3"
hex = "0.4"
memchr = "2"
parquet = { version = "=59.3.1", default-features = false, features = ["arrow", "snap", "flate2-zlib-rs", "brotli", "lz4", "zstd"] }
regex = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
yaml-rust2 = "0.10"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
rustix = { version = "1", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 0

[profile.test]
debug = 0
